<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BR-7147 · Redesign Input Field (prototype)</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<style>.cbtn{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Nunito+Sans:opsz,wght@6..12,500;6..12,700&display=swap" rel="stylesheet">
<style>
/* Layout: collapsible IA sidebar · phone stage with numbered elements · spec doc filling half the screen */
:root{
  --bg:#f3f3f1; --panel:#ffffff; --ink:#1d1d1b; --muted:#76766f; --muted2:#a9a8a1; --line:#e2e1dc;
  --accent:#3b5bdb; --accent-soft:#e8edff; --ok:#2f9e44; --warn:#e67700; --open:#9a9a92;
  --ui:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  /* Brian tokens, read from Figma (Student-App, frame 12532:149018) */
  --b-ink:#3a3a3a; --b-muted:#858585; --b-bg:#ffffff; --b-font:"Nunito Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18181a;--panel:#222225;--ink:#ececea;--muted:#9b9b96;--muted2:#76767a;--line:#333337;--accent:#8aa0ff;--accent-soft:#2a3150;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18181a;--panel:#222225;--ink:#ececea;--muted:#9b9b96;--muted2:#76767a;--line:#333337;--accent:#8aa0ff;--accent-soft:#2a3150;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);overflow:hidden}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-rows:48px 1fr;height:100%}
header{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.tid{font:500 12px var(--mono);color:var(--muted)}
.ttl{font-weight:600;font-size:14px;margin-right:8px}
.ib{border:1px solid transparent;background:none;border-radius:7px;padding:4px 8px;color:var(--muted)}
.ib:hover{background:var(--bg);color:var(--ink)}
.dd{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.dd select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 8px;font-size:12px}
.sp{flex:1}
.hbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;text-decoration:none;color:var(--ink);font-size:13px}
.hbtn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sync{font:11px var(--mono);color:var(--muted)}
.split{position:relative;display:flex}
.split .sp-main{border-radius:7px 0 0 7px}
.split .sp-dd{border-radius:0 7px 7px 0;border-left:0;padding:5px 8px}
.qr-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px;width:240px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qr-pop[hidden]{display:none}
.qr-pop #qr{background:#fff;padding:10px;border-radius:8px}
.qr-pop p{margin:0;font-size:12px;color:var(--muted)}
.qr-pop code{font:10px var(--mono);word-break:break-all;color:var(--muted)}
.cpin{position:absolute;width:24px;height:24px;margin:-24px 0 0 0;border-radius:12px 12px 12px 2px;background:#ffd43b;color:#5c4400;font:700 11px/24px var(--mono);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:30;border:0;padding:0;cursor:pointer}
.cpop{position:absolute;z-index:70;background:#fff9db;border:1px solid #f0c000;border-radius:10px;padding:8px 10px;width:240px;box-shadow:0 8px 24px rgba(0,0,0,.2);font:13px/1.4 var(--ui);color:#3d3200}
.cpop textarea{width:100%;border:0;background:none;resize:none;font:inherit;color:inherit;outline:none;min-height:54px}
.cpop .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#8a7400;margin-top:4px}
.cpop .row button{border:0;background:none;color:#8a7400;font:600 11px var(--ui);padding:2px 4px;cursor:pointer}
.cbtn{position:absolute;right:14px;bottom:14px;z-index:8;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 12px var(--ui);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cbtn.on{background:#ffd43b;border-color:#f0c000;color:#3d3200}
.stage.commenting .phone{cursor:crosshair}
body.proto .cbtn{position:fixed;right:16px;bottom:24px;padding:12px 14px;font-size:14px}
/* prototype-only view (#prototype): just the app, for phones */
body.proto header,body.proto aside,body.proto .doc,body.proto .minimap,body.proto .badge,body.proto .lines,body.proto .badge-tip{display:none!important}
body.proto .main{grid-template-columns:1fr!important}
body.proto .app{grid-template-rows:1fr}
body.proto .stage{background:#111}
body.proto .kbd{display:none}
/* native: on a phone the prototype IS the app: full width, real status bar, safe areas */
html:has(body.native),body.native,body.native .app,body.native .main,body.native .stage{background:#fff!important;color-scheme:light}
html:has(body.native.ctx-dark),body.native.ctx-dark,body.native.ctx-dark .app,body.native.ctx-dark .main,body.native.ctx-dark .stage{background:#2f2f2f!important}
body.native .pwrap{left:0;top:0;transform:none!important}
/* keyboard-safe: pin the app to the visible viewport, never let the page itself scroll (iOS shifts it when the keyboard opens) */
html:has(body.native),body.native{overflow:hidden;height:100%;overscroll-behavior:none}
body.native .phone{position:fixed;left:0;top:var(--vvtop,0px);width:100vw;height:var(--vvh,100dvh);border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top)}
/* tab bar height as in Figma (72px incl. home indicator): no extra safe-area padding below it */
body.native .p-tabs{padding-top:10px;padding-bottom:26px;height:92px}
body.native .cmp.notab:not(.focused){padding-bottom:calc(12px + env(safe-area-inset-bottom))}
body.native .p-status,body.native .home{display:none}
body.native .minimap,body.native .cbtn{display:none!important}
.main{--docw:50%;display:grid;grid-template-columns:minmax(0,1fr) var(--docw);min-height:0;transition:grid-template-columns .18s}
.main.nosb{grid-template-columns:minmax(0,1fr) var(--docw)}
#left,#tog-sb{display:none!important}
.main.dragging{transition:none;user-select:none;cursor:col-resize}
.doc{position:relative}
.resizer{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:20}
.resizer:hover,.main.dragging .resizer{background:linear-gradient(to right,transparent 3px,var(--accent) 3px,var(--accent) 5px,transparent 5px)}
@media (prefers-reduced-motion:reduce){.main{transition:none}}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0;min-width:0}
.main.nosb aside{overflow:hidden;border:0}
.sec{padding:12px 12px 4px;font:600 11px var(--ui);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.navi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 12px}
.navi:hover,.state:hover{background:var(--bg)}
.navi.on,.state.on{background:var(--accent-soft);color:var(--accent)}
.mode{border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:6px;padding:8px 12px 4px}
.mname{font-weight:600;flex:1;border:0;background:none;text-align:left;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{width:22px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12px;line-height:1;display:grid;place-items:center;flex:none;padding:0}
.stat.open{color:var(--open)}.stat.rework{color:var(--warn);border-color:var(--warn)}.stat.done{color:var(--ok);border-color:var(--ok)}
.state{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;text-align:left;padding:5px 12px 5px 40px;white-space:nowrap}
.state .dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.state .dot.has{background:var(--accent)}
.state .cov{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.state .cov.full{color:var(--ok)}
.ov-dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:120px;margin:4px auto 0}
.ov-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--accent);font:600 8px/11px var(--mono);font-style:normal;color:var(--accent)}
.ov-dots i.f{background:var(--accent);color:#fff}
.ov-name{display:block}
.add{border:0;background:none;color:var(--muted);padding:4px 12px 8px 40px;font-size:12px}
.add:hover{color:var(--accent)}
.addm{margin:8px 12px 16px;width:calc(100% - 24px);border:1px dashed var(--line);background:none;border-radius:7px;padding:6px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);padding:2px 4px;border-radius:4px;visibility:hidden}
.mrow:hover .x{visibility:visible}
/* stage */
.stage{position:relative;min-height:0;overflow:hidden;background:var(--bg)}
.pwrap{position:absolute;left:50%;top:50%;transform-origin:center center}
.lines{position:absolute;inset:-80px;width:calc(100% + 160px);height:calc(100% + 160px);pointer-events:none;overflow:visible}
.lines line{stroke:var(--accent);stroke-width:1.2}
.badge{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--accent);background:var(--panel);color:var(--accent);font:600 13px var(--mono);display:grid;place-items:center;padding:0;z-index:5;transition:opacity .12s}
.badge.cov{background:var(--accent);color:#fff}
.badge:hover{transform:scale(1.1)}
.pwrap.hide-b .badge,.pwrap.hide-b .lines{opacity:0;pointer-events:none}
.badge-tip{position:absolute;z-index:9;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;display:none}
.minimap{position:absolute;left:14px;top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;z-index:6}
.minimap:hover{border-color:var(--accent)}
.mm-row{display:flex;gap:3px}
.mm-cell{width:9px;height:16px;border-radius:2px;background:var(--line)}
.mm-cell.cur{background:var(--accent)}
.mm-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.hintl{position:absolute;left:14px;top:12px;font-size:11px;color:var(--muted);text-align:left;max-width:240px;line-height:1.5}
/* overview */
.overview{position:absolute;inset:0;overflow:auto;padding:20px 24px 80px;display:none;z-index:7;background:var(--bg)}
.stage.ov .overview{display:block}
.stage.ov .pwrap,.stage.ov .minimap,.stage.ov .hintl{display:none}
.ov-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ov-top h3{margin:0;font-size:14px}
.ov-mode{margin-bottom:20px}
.ov-mode h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.ov-row{display:flex;gap:16px;flex-wrap:wrap}
.ov-item{border:0;background:none;padding:0;text-align:center;font-size:11px;color:var(--muted)}
.ov-thumb{width:120px;height:261px;overflow:hidden;border-radius:14px;box-shadow:0 0 0 2px #111;margin-bottom:6px;position:relative;pointer-events:none}
.ov-item.cur .ov-thumb{box-shadow:0 0 0 3px var(--accent)}
.ov-thumb .phone{transform:scale(.2985);transform-origin:0 0;box-shadow:none;border-radius:0}
/* doc pane */
.doc{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.doc-head{padding:22px 40px 8px;display:flex;flex-direction:column;gap:6px}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.crumb a{color:var(--accent);text-decoration:none}
.doc-title{font:600 26px/1.2 var(--ui);border:0;background:none;padding:0;width:100%;color:var(--ink);outline:none}
.tools{display:flex;gap:2px;padding:4px 36px;border-bottom:1px solid var(--line)}
.tools button{border:0;background:none;padding:4px 8px;border-radius:6px;color:var(--muted);font-size:12px}
.tools button:hover{background:var(--bg);color:var(--ink)}
.tools .sp{flex:1}
.tools .meta{font-size:11px;color:var(--muted);align-self:center}
.edscroll{flex:1;overflow:auto;padding:56px 40px 0}
.edscroll>.dsec:first-child .sec-h{margin-top:0}
/* ~20 words per line, centered */
.edscroll,.doc-head,.tools,.jump{padding-left:max(40px,calc((100% - 92ch)/2))!important;padding-right:max(40px,calc((100% - 92ch)/2))!important}
.ed{padding:6px 0 18px;font:15px/1.6 var(--ui);outline:none;min-height:28px}
.dsec{color:var(--ink);transition:color .15s}
body.attn-proto .dsec:not(.cur){color:var(--muted)}
.dsec .sec-name{color:inherit}
.dsec.empty .sec-name{color:var(--muted2)}
.dsec.empty .ed:empty::before{content:"Not specced yet";color:var(--muted2);font-style:italic}
.dsec.empty.cur .ed:empty::before{content:attr(data-ph);font-style:normal}
.jump{display:flex;gap:2px;padding:6px 40px 0;border-bottom:1px solid var(--line)}
.jump button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font:500 13px var(--ui);cursor:pointer;margin-bottom:-1px}
.jump button.on{color:var(--ink);border-bottom-color:var(--ink)}
.grp-h{margin:44px 0 0;font:600 22px var(--ui);color:var(--ink)}
.edscroll>.grp-h:first-child{margin-top:0}
.mode-name{font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;border:0;background:none;padding:0;outline:none;min-width:40px;field-sizing:content}
.mdot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted2);flex:none;box-sizing:border-box}
.mdot.some{border-color:var(--accent);background:conic-gradient(var(--accent) 0 50%,transparent 0)}
.mdot.all{border-color:var(--accent);background:var(--accent)}
.mode-h .mx{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;visibility:hidden}
.mode-h:hover .mx{visibility:visible}
.addscr{border:0;background:none;color:var(--muted);font:500 12px var(--ui);padding:6px 0 0;cursor:pointer}
.addscr:hover{color:var(--accent)}
.addmode{margin:20px 0 0;width:100%;border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;color:var(--muted);cursor:pointer}
.edscroll{position:relative}
.aictl{position:absolute;display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel);z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.aictl button{border:0;background:none;padding:3px 8px;font:500 11px var(--ui);cursor:pointer;color:var(--muted)}
.aictl button+button{border-left:1px solid var(--line)}
.aictl .ok:hover{color:var(--ok)} .aictl .no:hover{color:#e03131}
.sec-h{margin:18px 0 2px;font:600 15px var(--ui);display:flex;align-items:center;gap:8px}
h2.sec-h{font-size:18px}
.sec-name{font:600 15px var(--ui);border:0;background:none;color:var(--ink);padding:0;flex:1;outline:none;min-width:0}
.sec-cov{font:11px var(--mono);color:var(--muted)}
.mode-h{margin:28px 0 0;padding-top:12px;border-top:1px solid var(--line);font:600 12px var(--ui);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:8px}
.mode-h a{color:var(--accent);text-decoration:none;text-transform:none;letter-spacing:0;font-weight:500}
.ed:empty::before,.ed>p:only-child:empty::before{content:'—';color:var(--line);pointer-events:none}
.ed:empty:focus::before{content:attr(data-ph);color:var(--muted);white-space:pre-line}
.ed h1{font-size:20px;margin:18px 0 6px}.ed h2{font-size:17px;margin:16px 0 4px}.ed h3{font-size:15px;margin:14px 0 4px}
.ed p{margin:0 0 6px}
.ed ol,.ed ul{margin:2px 0 6px;padding-left:26px}
.ed ol{list-style:decimal}
.ed li{margin:2px 0}
.ed ul{list-style:disc}.ed ul ul{list-style:circle}.ed ul ul ul{list-style:square}
.ed mark.ask{background:#fff3bf;color:#5c4400;border-radius:4px;padding:1px 5px}
.ed mark.ask::before{content:"Claude? ";font:600 11px var(--mono);opacity:.75}
.ed .ai{color:var(--accent)}
.ed a.fig{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--accent);text-decoration:none;background:var(--bg)}
.tools .acc{color:var(--accent)}
.ed code{font:13px var(--mono);background:var(--bg);padding:1px 4px;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:50}
.modal.show{display:grid}
.card{background:var(--panel);border-radius:12px;width:min(720px,92vw);max-height:84vh;overflow:auto;padding:18px 20px}
.card h2{margin:0 0 4px;font-size:17px}
.card .meta{color:var(--muted);font-size:12px}
pre.md{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px;font:12px/1.5 var(--mono);max-height:56vh;overflow:auto}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

/* ============ PHONE · Brian Student app ============ */
.phone{width:402px;height:874px;background:var(--b-bg);color:var(--b-ink);border-radius:46px;box-shadow:0 0 0 10px #111,0 24px 60px rgba(0,0,0,.22);position:relative;overflow:hidden;font:500 16px/1.4 var(--b-font);display:flex;flex-direction:column}
.phone b{font-weight:700}
.p-status{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 40px;font:600 15px/22px Inter,system-ui,sans-serif}
.p-status svg{display:block}
.p-head{height:35px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;margin:12px 0 8px}
.p-head .t{font-weight:700;font-size:16px}
.p-head [data-el]{display:grid;place-items:center;width:24px;height:24px;border:0;background:none;padding:0;color:inherit}
.p-chat{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:8px}
.m-t{padding:12px 24px 4px;display:flex;flex-direction:column;gap:8px}
.m-t p{margin:0}
.m-t .act{display:flex;height:16px}
.m-t .act button{border:0;background:none;padding:0;width:16px;height:16px}
.m-s{padding:12px 24px 12px 64px;display:flex;flex-direction:column;gap:16px}
.m-s .wl{height:1px;background:var(--b-ink);transform:scaleY(.75);transform-origin:0 0}
.tag{align-self:center;border:0;position:relative;font:700 12px/1.4 var(--b-font);padding:3px 8px;margin:8px 0}
.typing{display:flex;align-items:center;gap:16px;padding:12px 24px}
.ava{width:40px;height:40px;border-radius:50%;background:#efefef;border:0;position:relative;display:grid;place-items:center;font:700 15px var(--b-font)}
.dots{display:flex;gap:5px}.dots span{width:7px;height:7px;border-radius:50%;background:var(--b-ink);animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
/* composer — open variant per Figma "Chat Input Field / Variant2": padding 4 20 8, dashed bottom .75 */
.cmp{flex:none;display:flex;align-items:flex-end;gap:8px;position:relative}
.cmp .c-plus{width:40px;height:40px;border-radius:32px;border:0;background:var(--b-ink);display:grid;place-items:center;flex:none;padding:0}
.cmp .c-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:40px}
.cmp textarea{width:100%;border:0;background:none;resize:none;font:500 16px/22.4px var(--b-font);color:inherit;padding:8.8px 4px;outline:none;overflow-y:hidden;display:block}
.cmp textarea{scrollbar-width:none}
.cmp textarea::-webkit-scrollbar{display:none}
.cmp textarea::placeholder{color:var(--b-muted);font-size:14px}
.cmp .c-right{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;flex:none;padding:0;border-radius:32px;position:relative;color:var(--b-ink)}
.cmp .c-right.send{background:var(--b-ink);color:#fff}
.cmp .resv{position:absolute;inset:2px;border:1.5px dashed #c69a00;border-radius:50%;display:none}
.reserved .cmp .resv{display:block}

<script>
/* ================= data ================= */
const FIG = id => "https://www.figma.com/design/GbI4xt40lr0Jmk3rkgrtM0/Student-App?node-id=" + id;
const p = s => s.split("\n").map(l=>`<p>${l}</p>`).join("");
const DEFAULT = {
  v:2,
  docs:{
    brief:`<h2>Problem</h2>${p("Students and teachers find the chat hard to use.")}<ul><li>Typing is hard: the + and send icons eat horizontal space, and the field wraps after 5 lines (ChatGPT/Claude: 7–8).</li><li>Writing on a phone is cumbersome, so teachers ask for voice input (STT).</li><li>After sending, the field stays open and takes space away from Brian's answer.</li></ul><h2>Goal</h2>${p("Bring chat input up to current benchmark standards: as much horizontal space for text as possible, 7 lines before scrolling, and a layout with room for STT (and maybe full S2S) later.")}<h2>Success criteria</h2><p><br></p><h2>In scope</h2><ul><li>All chats in the Student app (AI Tutor, AI Dialogues, chatbots)</li><li>Layout of the field and growth behavior</li><li>Upload (+): Gallery, Camera, Document, Drawing</li></ul><h2>Out of scope</h2><ul><li>STT and full S2S: reserve space only</li><li>Tablet / desktop breakpoints</li><li>Learning Diary input → BR-7144</li></ul>`,
    rules:`<p><b>R1</b> Up to 7 lines, then the field scrolls. (from ticket)</p>`,
    edges:"",
    questions:`<ul><li>What is the resting state after sending: single line, or hidden?</li><li>Does the Learning Diary chat keep its input open? (→ BR-7144)</li><li>Focus mode: in scope for this ticket, or backlog?</li></ul>`
  },
  modes:[
    {id:"idle",name:"Idle / after sending",status:"open",figma:FIG("12532-122985"),states:[{id:"idle-rest",name:"Resting",kind:"idle",doc:"",links:{}}]},
    {id:"typing",name:"Typing",status:"open",figma:"",states:[
      {id:"t-empty",name:"Empty, focused",kind:"typing-empty",doc:"",links:{}},
      {id:"t-3",name:"3 lines",kind:"typing-3",doc:"",links:{}},
      {id:"t-7",name:"7 lines (max)",kind:"typing-7",doc:"",links:{}},
      {id:"t-over",name:"Overflow, scrolling",kind:"typing-overflow",doc:"",links:{}}]},
    {id:"upload",name:"Upload (+)",status:"open",figma:"",states:[
      {id:"u-sheet",name:"Dialog open",kind:"upload-sheet",doc:"",links:{}},
      {id:"u-pick",name:"Native picker (half screen)",kind:"upload-picker",doc:"",links:{}},
      {id:"u-att",name:"Attachment added",kind:"upload-attached",doc:"",links:{}}]},
    {id:"send",name:"Sending / Brian answers",status:"open",figma:"",states:[{id:"s-wait",name:"Brian is typing",kind:"sending",doc:"",links:{}}]},
    {id:"focus",name:"Focus mode",status:"open",figma:"",states:[{id:"f-tbd",name:"Not designed yet",kind:"placeholder",doc:"",links:{}}]},
    {id:"voice",name:"Voice (reserved)",status:"open",figma:"",states:[{id:"v-res",name:"Reserved space",kind:"reserved",doc:"",links:{}}]}
  ]
};
const VARIANTS=[{id:"open",name:"Open (workbook line)",figma:FIG("12532-149018")},{id:"pill",name:"Pill",figma:FIG("12532-148660")}];
const CONTEXTS=[{id:"tutor",name:"AI Tutor"},{id:"dialog",name:"AI Dialog (dark)"}];
let S=structuredClone(DEFAULT);
const ui={sel:{kind:"state",mode:"idle",state:"idle-rest"},variant:"open",context:"tutor",sb:true,live:{}};

/* ================= persistence ================= */
let dirty=false,DOC=null,DB=null,saving=false,again=false,tmr=null,lastSaved=null,pendingRemote=null,lastSnap=0;
const syncEl=document.getElementById("sync");
const setSync=t=>syncEl.textContent=t;
function unwrap(s){ if(!s) return null; if(typeof s.data==="function") return s.data(); if(s.exists===false) return null; return s.data!==undefined?s.data:s; }
const valid=d=>d&&d.v===2&&Array.isArray(d.modes)&&d.docs;
function migrate(old){ // v1 → v2: carry over any written specs and statuses
  const d=structuredClone(DEFAULT); if(!old||!Array.isArray(old.modes)) return d;
  for(const om of old.modes){ const m=d.modes.find(x=>x.id===om.id); if(!m) continue; m.status=om.status||m.status; if(om.figma) m.figma=om.figma;
    for(const os of om.states||[]){ const s=m.states.find(x=>x.id===os.id); if(s&&os.spec) s.doc=os.spec.split("\n").map(l=>`<p>${esc(l)||"<br>"}</p>`).join(""); } }
  return d;
}
async function initDb(){
  let db=null;
  try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){}
  if(!db){ loadLocal(); setSync("local only"); return; }
  DB=db;
  try{
    DOC=db.doc("workbench/br-7147-v2");
    const guard=setTimeout(()=>setSync("offline · local"),10000);
    let d=unwrap(await DOC.get());
    if(!valid(d)){ const old=unwrap(await db.doc("workbench/br-7147").get()); d=migrate(old); S=d; flush(); }
    else S=structuredClone(d);
    try{ await db.doc("history/pre-unified-doc").get().then(async x=>{ if(!unwrap(x)) await db.doc("history/pre-unified-doc").set({at:new Date().toISOString(),data:JSON.parse(JSON.stringify(d))}); }); }catch(e){}
    clearTimeout(guard); render(true); setSync("saved"); loadPreviews();
    try{ DOC.onSnapshot(snap=>{ const r=unwrap(snap); if(!valid(r)||r.updated===lastSaved||r.updated===S.updated) return;
      if(saving||tmr||dirty) return;
      const a=document.activeElement; if(a&&a.closest&&a.closest(".ed,.sec-name")){ pendingRemote=r; setSync("Claude updated · click outside to load"); return; }
      S=structuredClone(r); render(true); setSync("updated by Claude"); }); }catch(e){}
  }catch(e){ loadLocal(); setSync("offline · local"); }
}
function loadLocal(){ try{ const d=JSON.parse(localStorage.getItem("wb-br7147-v2")||"null"); if(valid(d)){ S=structuredClone(d); render(); } }catch(e){} }
function save(){ dirty=true; try{ localStorage.setItem("wb-br7147-v2",JSON.stringify(S)); }catch(e){} if(!DOC) return; setSync("editing…"); clearTimeout(tmr); tmr=setTimeout(flush,800); }
async function flush(){ tmr=null; if(!DOC) return; if(saving){ again=true; return; } saving=true; setSync("saving…");
  try{ S.updated=new Date().toISOString(); lastSaved=S.updated; await DOC.set(JSON.parse(JSON.stringify(S))); dirty=false; setSync("saved");
    if(Date.now()-lastSnap>600000){ lastSnap=Date.now(); try{ await DB.doc("history/"+S.updated.replace(/[^0-9T]/g,"")).set({at:S.updated,data:JSON.parse(JSON.stringify(S))}); }catch(e){} } }catch(e){ setSync("save failed · kept locally"); }
  saving=false; if(again){ again=false; flush(); } }

/* ================= helpers ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mode=id=>S.modes.find(m=>m.id===id);
const curMode=()=>mode(ui.sel.mode)||S.modes[0];
const curState=()=>{ const m=curMode(); return m&&(m.states.find(s=>s.id===ui.sel.state)||m.states[0]); };
const uid=x=>x+Math.random().toString(36).slice(2,7);
const flat=()=>S.modes.flatMap(m=>m.states.map(s=>({m,s})));
const find=id=>flat().find(x=>x.s.id===id);
const STAT={open:"○",rework:"⚠",done:"✓"};
const textOf=html=>{ const d=document.createElement("div"); d.innerHTML=html||""; d.querySelectorAll("mark.ask").forEach(m=>m.remove()); return d.textContent; };

/* ================= icons (exported from Figma: Nucleo + tab bar) ================= */
const I={
 plus:c=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 4.33V19.67M4.33 12H19.67" stroke="${c}" stroke-width="1.33" stroke-linecap="round"/></svg>`,
 mic:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"><path d="M16.33 6.67a4.33 4.33 0 0 0-8.66 0v4a4.33 4.33 0 0 0 8.66 0z"/><path d="M20.33 10.67A8.33 8.33 0 0 1 3.67 10.67M12 19v2.67"/></svg>`,
 send:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M21.0894 10.5014L5.80142 2.56271C5.19742 2.25071 4.47208 2.32938 3.94809 2.76004C3.42542 3.19204 3.21209 3.89204 3.40409 4.54138L5.31742 11H11.8481C12.4001 11 12.8481 11.448 12.8481 12C12.8481 12.552 12.4001 13 11.8481 13H5.31742L3.40409 19.4587C3.21075 20.1094 3.42542 20.808 3.94809 21.24C4.25742 21.4947 4.63875 21.6267 5.02275 21.6267C5.28808 21.6267 5.55475 21.564 5.80142 21.436L21.0894 13.4974C21.6508 13.2054 22.0001 12.632 22.0001 11.9987C22.0001 11.3654 21.6508 10.7934 21.0894 10.5014Z" fill="currentColor"/></svg>`,
 menu:`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.33" stroke-linecap="round"><path d="M18.33 12.33H1.67M9 17H1.67M18.33 7.67H1.67M18.33 3H1.67"/></svg>`,
 newchat:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.33" stroke-linecap="round"><circle cx="12" cy="12" r="9.67"/><path d="M7.67 12h8.66M12 7.67v8.66"/></svg>`,

/* numbered badges outside the phone, with leader lines */
function placeBadges(){
  const W=document.getElementById("pwrap"), ph=$(".phone",W); if(!ph) return;
  W.querySelectorAll(".badge").forEach(b=>b.remove());
  const svg=document.getElementById("lines"); svg.innerHTML="";
  const pr=ph.getBoundingClientRect(), sc=ui.scale, PW=402, PH=874;
  const els=[...ph.querySelectorAll("[data-el]")].filter(e=>e.offsetParent!==null);
  const refs=allRefs();
  const used={left:[],right:[],top:[],bottom:[]};
  els.forEach((e,i)=>{
    const n=elNum(e.dataset.el), r=e.getBoundingClientRect();
    const cx=(r.left+r.width/2-pr.left)/sc, cy=(r.top+r.height/2-pr.top)/sc;
    let side = cy<110?"top":cy>PH-90?"bottom":cx>PW/2?"right":"left";
    let bx,by;
    if(side==="left"){ bx=-44; by=cy; } else if(side==="right"){ bx=PW+44; by=cy; } else if(side==="top"){ bx=cx; by=-44; } else { bx=cx; by=PH+44; }
    // nudge to avoid overlapping badges on the same side
    const axis=(side==="left"||side==="right")?"y":"x";
    let pos=axis==="y"?by:bx; while(used[side].some(u=>Math.abs(u-pos)<36)) pos+=36; used[side].push(pos);
    if(axis==="y") by=pos; else bx=pos;
    const b=document.createElement("button");
    b.className="badge"+(refs.has(n)?" cov":"");
    b.textContent=n; b.style.left=bx+"px"; b.style.top=by+"px";
    b.dataset.el=e.dataset.el; b.dataset.label=e.dataset.label; b.setAttribute("aria-label",`#${n} ${e.dataset.label}`);
    W.appendChild(b);
    const L=document.createElementNS("http://www.w3.org/2000/svg","line");
    L.setAttribute("x1",bx+80); L.setAttribute("y1",by+80); L.setAttribute("x2",cx+80); L.setAttribute("y2",cy+80);
    svg.appendChild(L);
  });
  ui.elCount=els.length;
}

  if(textOf(f.s.doc).trim()) prev.doc=(prev.doc||"")+`<p><b>From “${esc(f.s.name||"deleted screen")}”:</b></p>`+f.s.doc;
  for(const st of flat()) for(const k in (st.s.links||{})) if(st.s.links[k]===f.s.id) delete st.s.links[k];
  m.states.splice(i,1); save(); go(prev.id);
  setTimeout(()=>{ const ed=document.querySelector(`.ed[data-state="${CSS.escape(prev.id)}"]`); if(ed){ ed.focus(); caretToEnd(ed); } },80);
});
docEl.addEventListener("focusout",e=>{ const inp=e.target.closest&&e.target.closest(".sec-name"); if(inp){ delete inp.dataset.arm; if(inp.value===""){ const f=find(inp.dataset.state); if(f){ inp.value=f.s.name||"Untitled screen"; } inp.placeholder=""; } } });

/* ================= ticket draft (HTML → markdown) ================= */
function md(html){
  const d=document.createElement("div"); d.innerHTML=html||"";
  const walk=(n,lvl,ord)=>{ let o=""; n.childNodes.forEach(c=>{
    if(c.nodeType===3){ o+=c.textContent; return; }
    const t=c.tagName;
    if(t==="MARK"&&c.classList.contains("ask")) return;
    if(t==="A"){ o+=`[${c.textContent.replace(" ↗","")}](${c.getAttribute("href")})`; return; }
    if(t==="H1"||t==="H2") o+=`\n### ${c.textContent}\n`; else if(t==="H3") o+=`\n#### ${c.textContent}\n`;
    else if(t==="P"||t==="DIV") o+=walk(c,lvl)+"\n";
    else if(t==="B"||t==="STRONG") o+=`**${c.textContent}**`;
    else if(t==="BR") o+="\n";
    else if(t==="OL"||t==="UL"){ let i=1; c.childNodes.forEach(li=>{ if(li.tagName!=="LI"){ if(li.tagName==="OL"||li.tagName==="UL") o+=walk({childNodes:[li]},lvl+1); return; }
        const own=[...li.childNodes].filter(x=>!(x.tagName==="OL"||x.tagName==="UL")); const sub=[...li.childNodes].filter(x=>x.tagName==="OL"||x.tagName==="UL");
        o+=`${"   ".repeat(lvl)}${t==="OL"?(i++)+".":"-"} ${walk({childNodes:own},lvl).trim()}\n`; sub.forEach(sl=>o+=walk({childNodes:[sl]},lvl+1)); }); }
    else o+=walk(c,lvl);
  }); return o; };
  return walk(d,0).replace(/\n{3,}/g,"\n\n").trim();
}
function ticketMd(){
  let o=`# Problem, goal & scope\n${md(S.docs.brief)}\n\n# Proposed solution\n## Global rules\n${md(S.docs.rules)}\n`;
  for(const m of S.modes){ o+=`\n## ${m.name}${m.figma?` ([Figma](${m.figma}))`:""}\n`; for(const s of m.states) o+=`\n### ${s.name}\n${md(s.doc)||"_no spec yet_"}\n`; }
  o+=`\n# Edge cases & touchpoints\n${md(S.docs.edges||"")||"_none yet_"}\n\n# Open questions\n${md(S.docs.questions)}\n`; return o;
}
const modal=document.getElementById("modal"), card=document.getElementById("mcard");

  card.innerHTML=`<h2>Ticket draft</h2><p class="meta">Assembled from the workbench: Brief → Global rules → Specs per screen → Open questions.</p><pre class="md">${esc(ticketMd())}</pre><div class="row-end"><button class="hbtn" id="cp">Copy markdown</button><button class="hbtn pri" id="cl">Close</button></div>`;
  modal.classList.add("show");
});
